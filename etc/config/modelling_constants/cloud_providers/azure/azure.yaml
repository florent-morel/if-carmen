
# Mapping of Azure region codes to country names used in carbon_intensity.yaml
regions:
  australiaeast: Australia
  centralus: United_States
  eastasia: Hong_Kong
  eastus: United_States
  eastus2: United_States
  francecentral: France
  francesouth: France
  germanywestcentral: Germany
  northcentralus: United_States
  northeurope: Ireland
  southeastasia: Singapore
  swedencentral: Sweden
  uaenorth: Dubai
  uksouth: United_Kingdom
  westeurope: Netherlands
  westus: United_States
  westus2: United_States
  westus3: United_States
  centralindia: India
  southindia: India

# Mapping of internal PaaS zone codes (after digit-stripping) to Azure region names.
# Keys must be uppercase and digit-free, matching what PaasCiMapper derives from
# the raw PaaS value via remove_unnecessary(paas.upper()).
zone_aliases:
  EUS: eastus
  WUS: westus
  NE: northeurope
  EUN: northeurope       # covers PaaS codes like EUN1, EUN2, …
  IRL: northeurope
  FC: francecentral
  SA: southeastasia
  GWC: germanywestcentral
  ERD: germanywestcentral
  MUC: germanywestcentral
  CDF: germanywestcentral
  CDFDEV: germanywestcentral
  NLD: westeurope
  WE: westeurope
  NGI: northeurope
  NET: westeurope
  NCE: francesouth

# Electricity ratios
electricity_ratios:
  cpu_min: 0.78  # watt per core
  cpu_max: 3.76  # watt per core
  memory: 0.392  # watt per GB
  # Storage ratios
  # in kWh/GBh from https://www.cloudcarbonfootprint.org/docs/methodology/#storage
  ssd: 0.0000012
  hdd: 0.00000065
  storage_unknown: 0.000000925  # Average

# Replication factors for different Azure storage types
# https://docs.google.com/spreadsheets/d/1D7mIGKkdO1djPoMVmlXRmzA7_4tTiGZLYdVbfe85xQM/edit?gid=2008238628#gid=2008238628
storage_replication_factors:
  lrs: 3  # Locally redundant storage - 3 copies in single physical location
  zrs: 3  # Zone redundant storage - 3 copies across availability zones
  grs: 6  # Geo redundant storage - 3 primary + 3 secondary copies
  ra_grs: 6  # Read-access geo redundant - same as GRS
  gzrs: 6  # Geo-zone redundant - 3 copies across zones + 3 secondary
  ra_gzrs: 6  # Read-access geo-zone - same as GZRS


# Azure Disk SKU to size mapping in GiB
disk_sku_size_mapping:
  # Premium SSD (P series)
  P1: 4
  P2: 8
  P3: 16
  P4: 32
  P6: 64
  P10: 128
  P15: 256
  P20: 512
  P30: 1024
  P40: 2048
  P50: 4096
  P60: 8192
  P70: 16384
  P80: 32767
  # Standard SSD (E series)
  E1: 4
  E2: 8
  E3: 16
  E4: 32
  E6: 64
  E10: 128
  E15: 256
  E20: 512
  E30: 1024
  E40: 2048
  E50: 4096
  E60: 8192
  E70: 16384
  E80: 32767
  # Standard HDD (S series)
  S4: 32
  S6: 64
  S10: 128
  S15: 256
  S20: 512
  S30: 1024
  S40: 2048
  S50: 4096
  S60: 8192
  S70: 16384
  S80: 32767


# Power usage effectiveness for this cloud provider
pue: 1.185
