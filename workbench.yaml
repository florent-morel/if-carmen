registry: "dockerhub.rnd.amadeus.net/acfc-docker-dev-cb-test-nce"
version_base: 1.0
release_branches: "^release/0"
forge:
  name: carbon-engine
  component: webapp
  versionType: "semantic"
  sonar:
    enabled: true
  helm:
    artifactoryRepository: "ACFC-helm-dev-cb-test-nce"
    bitbucketProject: "FORGE"
  security:
    uploadReports: true
    application: Carbon-Measurement-Engine
  tests:
    - name: pylint
      image: "carbon-engine-webapp"
      command: "cd /app && pylint --fail-under=9.8 --jobs=0 ./backend"
    - name: unit-tests
      image: "carbon-engine-webapp"
      command: "cd /app && python3 -m pytest -n auto --ignore=./backend/tests/services/carbon_service/impact_framework/computation --ignore=./backend/tests/daemon/test_daemon_computation.py  ./backend/tests"
    - name : computation-tests
      image: "carbon-engine-webapp"
      command: "cd /app && npm install && python3 -m pytest ./backend/tests/services/carbon_service/impact_framework/computation && python3 -m pytest ./backend/tests/daemon/test_daemon_computation.py"
#    - name: system
#      image: "carbon-engine-webapp"
#      command: "cd /app && uvicorn backend.src.main:app --reload & SERVER_PID=$! && sleep 8 && robot -d backend/tests/test_output/system_tests_output --variable HOST:http://127.0.0.1:8000/api --variable PYTHONLIBPATH:/usr/local/lib/python3.11 ./backend/tests/system_tests/ && kill $SERVER_PID"
